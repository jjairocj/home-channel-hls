<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <!-- Home Channel HLS - Generic Broadcast Identity Logo -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Broadcast Symbol -->
  <g transform="translate(30, 25)">
    <!-- Antenna Tower / Signal Waves -->
    <circle cx="45" cy="50" r="14" fill="url(#primaryGrad)"/>
    <path d="M 45 22 A 28 28 0 0 1 73 50" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 17 50 A 28 28 0 0 1 45 22" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 45 8 A 42 42 0 0 1 87 50" fill="none" stroke="#7000ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 3 50 A 42 42 0 0 1 45 8" fill="none" stroke="#7000ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="64" x2="45" y2="95" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="95" x2="58" y2="95" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(135, 30)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="1">HOME</text>
    <text x="135" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="40" fill="#00f0ff" letter-spacing="1">CHANNEL</text>
    
    <!-- Badge -->
    <rect x="0" y="58" width="92" height="24" rx="4" fill="url(#primaryGrad)"/>
    <text x="46" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#050811" text-anchor="middle" letter-spacing="2">24/7 HLS</text>

    <!-- Subtitle -->
    <text x="104" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.7)" letter-spacing="3">LINEAR PLAYOUT</text>
  </g>
</svg>
