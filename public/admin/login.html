<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#0b3a5c">
  <title>Iniciar sesión — Home Channel Master Control</title>
  <meta name="description" content="Acceso restringido al Master Control de Home Channel.">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">

  <style>
    :root {
      --font-ui: "Segoe UI", "Segoe UI Variable Text", Tahoma, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font: 14px/1.4 var(--font-ui);
      color: #fff;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%, rgba(110, 200, 255, 0.45), transparent 65%),
        radial-gradient(ellipse 70% 50% at 100% 100%, rgba(40, 170, 120, 0.4), transparent 60%),
        linear-gradient(170deg, #062449 0%, #0b4f86 42%, #12819c 66%, #08304f 100%);
    }

    /* Cintas de luz */
    .ribbon {
      position: fixed;
      border-radius: 50%;
      filter: blur(34px);
      mix-blend-mode: screen;
      opacity: 0.55;
      pointer-events: none;
      animation: drift 24s ease-in-out infinite alternate;
    }
    .ribbon.r1 { width: 150vw; height: 24vh; left: -25vw; top: 26vh; transform: rotate(-10deg); background: linear-gradient(90deg, transparent, rgba(170, 255, 210, 0.8), rgba(120, 220, 255, 0.7), transparent); }
    .ribbon.r2 { width: 130vw; height: 14vh; left: -10vw; top: 54vh; transform: rotate(-5deg); background: linear-gradient(90deg, transparent, rgba(210, 255, 150, 0.55), rgba(90, 210, 200, 0.55), transparent); animation-duration: 32s; }
    .ribbon.r3 { width: 120vw; height: 5vh; left: -5vw; top: 44vh; transform: rotate(-8deg); filter: blur(12px); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent); animation-duration: 19s; }
    @keyframes drift { from { translate: -4vw 0; } to { translate: 4vw -3vh; } }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 16px;
    }

    /* Imagen de usuario con marco de cristal */
    .user-tile {
      position: relative;
      width: 132px;
      height: 132px;
      padding: 10px;
      border-radius: 14px;
      background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.18) 50%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.28));
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.45);
    }
    .user-tile .picture {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.45);
      font: 700 54px/1 "Segoe UI", Arial, sans-serif;
      color: #fff;
      text-shadow: 0 0 14px rgba(160, 225, 255, 0.95), 0 2px 4px rgba(0, 0, 0, 0.4);
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.55), transparent 45%),
        linear-gradient(135deg, #2b8fd6, #14b39a);
    }

    .user-name {
      margin: 4px 0 0;
      font-size: 24px;
      font-weight: 300;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
    }
    .user-hint { margin: -10px 0 4px; font-size: 13px; opacity: 0.85; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5); }

    /* Caja de contraseña con botón de flecha */
    .password-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: min(300px, 100%);
    }
    .password-box {
      position: relative;
      flex: 1;
    }
    .password-box input {
      width: 100%;
      height: 32px;
      padding: 4px 34px 4px 8px;
      font: 15px var(--font-ui);
      color: #1b2430;
      background: #fff;
      border: 1px solid;
      border-color: #3d7bad #a4c9e3 #b7d9ed #b5cfe7;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 2px 8px rgba(0, 0, 0, 0.25);
      outline: none;
    }
    .password-box input::placeholder { color: #8e99a6; font-style: italic; }
    .reveal {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: 1px solid transparent;
      border-radius: 2px;
    }
    .reveal:hover { border-color: #b8d6fb; background: linear-gradient(#f5fafe, #e3effc); }

    .go {
      flex: none;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      border: 1px solid #0d2f52;
      border-radius: 50%;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.15) 45%, transparent 47%),
        radial-gradient(circle at 50% 110%, #7fd4ff, #1d77c9 55%, #0d3f78);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4), 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: box-shadow 0.2s, filter 0.2s;
    }
    .go:hover, .go:focus-visible { outline: none; filter: brightness(1.12); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55), 0 0 12px rgba(120, 210, 255, 0.95); }
    .go:disabled { filter: grayscale(0.6) brightness(0.9); cursor: default; }

    .status {
      min-height: 22px;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    /* Indicador de espera (anillo) */
    .busy {
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 300;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }
    .busy::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(255, 255, 255, 0), #bfe8ff, #fff);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.is-busy .busy { display: inline-flex; }
    body.is-busy .password-row,
    body.is-busy .status,
    body.is-error .password-row,
    body.is-error .user-hint,
    body.is-error .status { display: none; }

    /* Mensaje de error con botón Aceptar */
    .error-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    body.is-error .error-box { display: flex; }

    .btn {
      min-width: 86px;
      min-height: 30px;
      padding: 4px 16px;
      font: 13px var(--font-ui);
      color: #1b2430;
      cursor: pointer;
      border: 1px solid #3c7fb1;
      border-radius: 3px;
      background: linear-gradient(#f2f9fd 0%, #e3f2fb 49%, #cfe8f7 50%, #bcdff3 100%);
      box-shadow: inset 0 0 0 1px #a8dbf7;
      text-shadow: none;
    }
    .btn:hover, .btn:focus-visible { outline: none; background: linear-gradient(#eaf6fd 0%, #d9f0fc 49%, #bee6fd 50%, #a7d9f5 100%); box-shadow: inset 0 0 0 1px #a8dbf7, 0 0 8px rgba(120, 210, 255, 0.9); }

    .shake { animation: shake 0.42s cubic-bezier(.36, .07, .19, .97) both; }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    /* Pie: volver al televisor y marca */
    footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.35));
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-size: 13px;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      border: 1px solid transparent;
      border-radius: 3px;
    }
    .back:hover { border-color: rgba(255, 255, 255, 0.45); background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.02) 50%, rgba(255, 255, 255, 0.14)); }
    .back .power {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      font-size: 13px;
      border: 1px solid #5a1a10;
      border-radius: 4px;
      background: linear-gradient(#e8a897 0%, #d27d66 45%, #b9361a 50%, #c94d2c 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }
    .brand {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }
    .brand strong { font-weight: 600; }
    .brand span { font-size: 13px; opacity: 0.85; margin-left: 6px; }

    @media (max-width: 480px) {
      .user-tile { width: 112px; height: 112px; }
      .user-name { font-size: 21px; }
      .password-box input { height: 40px; font-size: 16px; }
      .go { width: 40px; height: 40px; }
      footer { flex-direction: column-reverse; }
      .brand span { display: block; margin: 0; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ribbon, .shake { animation: none; }
    }
  </style>
</head>
<body>
  <span class="ribbon r1" aria-hidden="true"></span>
  <span class="ribbon r2" aria-hidden="true"></span>
  <span class="ribbon r3" aria-hidden="true"></span>

  <main>
    <div class="user-tile" aria-hidden="true"><div class="picture">X</div></div>
    <h1 class="user-name">Master Control</h1>
    <p class="user-hint">Acceso restringido</p>

    <form class="password-row" id="loginForm" autocomplete="on">
      <input type="text" name="username" value="master" autocomplete="username" hidden>
      <div class="password-box">
        <input type="password" id="secretInput" name="password" placeholder="Contraseña" autocomplete="current-password" autofocus required aria-label="Contraseña">
        <button type="button" class="reveal" id="btnToggleVis" title="Mostrar u ocultar la contraseña" aria-label="Mostrar contraseña">👁</button>
      </div>
      <button type="submit" class="go" id="btnGo" title="Entrar" aria-label="Entrar">➜</button>
    </form>

    <div class="status" id="statusText" role="status"></div>
    <div class="busy" id="busyText">Bienvenido</div>

    <div class="error-box" id="errorBox" role="alert">
      <span id="errorText">La contraseña no es correcta.</span>
      <button type="button" class="btn" id="btnErrorOk">Aceptar</button>
    </div>
  </main>

  <footer>
    <a href="/" class="back"><span class="power">⏻</span> Volver al televisor</a>
    <div class="brand"><strong>Home Channel</strong> X-99 <span>Master Control Studio</span></div>
  </footer>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const input = document.getElementById('secretInput');
      const go = document.getElementById('btnGo');
      const reveal = document.getElementById('btnToggleVis');
      const status = document.getElementById('statusText');
      const busy = document.getElementById('busyText');
      const errorText = document.getElementById('errorText');
      const errorOk = document.getElementById('btnErrorOk');
      const tile = document.querySelector('.user-tile');
      let submitting = false;

      function setState(state) {
        document.body.classList.toggle('is-busy', state === 'busy');
        document.body.classList.toggle('is-error', state === 'error');
      }

      function showError(message) {
        errorText.textContent = message;
        setState('error');
        tile.classList.remove('shake');
        void tile.offsetWidth;
        tile.classList.add('shake');
        errorOk.focus();
      }

      errorOk.addEventListener('click', () => {
        setState(null);
        input.value = '';
        input.focus();
      });

      reveal.addEventListener('click', () => {
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        reveal.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
        input.focus();
      });

      // Bloq Mayús activado
      input.addEventListener('keyup', (e) => {
        status.textContent = e.getModifierState && e.getModifierState('CapsLock') ? '⚠ Bloq Mayús está activado' : '';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (submitting) return;
        const password = input.value;
        if (!password) return showError('Escribe la contraseña.');

        submitting = true;
        go.disabled = true;
        busy.textContent = 'Comprobando...';
        setState('busy');

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            busy.textContent = 'Bienvenido';
            try { sessionStorage.setItem('x99_admin_auth', data.token || 'ok'); } catch (err) {}
            setTimeout(() => { window.location.href = '/admin/'; }, 700);
            return;
          }
          showError(res.status === 429 ? (data.error || 'Demasiados intentos. Espera un momento.') : 'La contraseña no es correcta.');
        } catch (err) {
          showError('No se pudo conectar con el servidor.');
        }
        submitting = false;
        go.disabled = false;
      });

      setTimeout(() => input.focus(), 200);
    })();
  </script>
</body>
</html>
